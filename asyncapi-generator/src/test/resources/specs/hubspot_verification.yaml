asyncapi: 3.0.0
x-ballerina-event-identifier:
  type: "body"
  path: "subscriptionType"
x-ballerina-auth:
  header: "X-HubSpot-Signature-v3"
  signature:
    algorithm: "sha256"
    encoding: "base64"
    headerFormat: "$signature"
    input: "$method . $uri . $body . $header('X-HubSpot-Request-Timestamp')"
info:
  title: HubSpot Subscription API
  version: 1.0.0
  description: Webhook notifications for selected event types on HubSpot
  termsOfService: "https://legal.hubspot.com/terms-of-service"
  contact:
    name: HubSpot support
    url: "https://developers.hubspot.com/"
  externalDocs:
    description: HubSpot Webhooks API documentation
    url: "https://developers.hubspot.com/docs/api-reference/latest/webhooks/guide"
