components:
  schemas:
    WebhookEvent:
      additionalProperties: true
      required:
        - eventId
      properties:
        eventId:
          type: integer
          description: The ID of the event that triggered this notification. This value is not guaranteed to be unique.
        subscriptionId:
          type: integer
          description: The ID of the subscription that triggered a notification about the event.
        portalId:
          type: integer
          description: The customer's (HubSpot account ID)[https://knowledge.hubspot.com/account/manage-multiple-hubspot-accounts?_ga=2.56562472.2054080341.1656611011-2068059512.1656469161#check-your-current-account] where the event occurred.
        appId:
          type: integer
          description: The ID of the HubSpot application
        occurredAt:
          type: integer
          description: When this event occurred as a millisecond timestamp.
        subscriptionType:
          type: string
          description: Type of the event
        attemptNumber:
          type: integer
          description: Starting at 0, which number attempt this is to notify your service of this event. If your service times-out or throws an error as describe in the Retries section below, HubSpot will attempt to send the notification again.
        objectId:
          type: integer
          description: The ID of the object that was created, changed, or deleted. For contacts this is the contact ID; for companies, the company ID; for deals, the deal ID; and for conversations the thread ID
        changeSource:
          type: string
          description: The source of the change. This can be any of the change sources that appear in contact property histories.
        sourceId:
          type: string
          description: The ID of the source of the change. The format depends on the change source (for example, "userId:12345" for changes made by a user in the CRM UI).
        changeFlag:
          type: string
          description: Flag of the change.
        propertyName:
          type: string
          description: The name of the property changed. Present for propertyChange events.
        propertyValue:
          type: string
          description: The new value set for the property that triggered the notification. Present for propertyChange events.
        associationType:
          type: string
          description: The type of the association (e.g. CONTACT_TO_COMPANY, DEAL_TO_LINE_ITEM). Present for associationChange events.
        fromObjectId:
          type: integer
          description: The ID of the record that the association change was made from. Present for associationChange events.
        toObjectId:
          type: integer
          description: The ID of the secondary record in the association event. Present for associationChange events.
        associationRemoved:
          type: boolean
          description: Whether the association was removed (true) or added (false). Present for associationChange events.
        isPrimaryAssociation:
          type: boolean
          description: Whether the secondary record is the primary association. Present for associationChange events.
        primaryObjectId:
          type: integer
          description: The ID of the merge winner, which is the record that remains after the merge. Present for merge events.
        mergedObjectIds:
          type: array
          items:
            type: integer
          description: An array of IDs that represent the records merged into the winner. Present for merge events.
        newObjectId:
          type: integer
          description: The ID of the record created as a result of the merge. Present for merge events.
        numberOfPropertiesMoved:
          type: integer
          description: How many properties were transferred during the merge. Present for merge events.
        messageId:
          type: integer
          description: The ID of the new message. Present for conversation.newMessage events.
        messageType:
          type: string
          description: The type of the new message, either MESSAGE or COMMENT. Present for conversation.newMessage events.
