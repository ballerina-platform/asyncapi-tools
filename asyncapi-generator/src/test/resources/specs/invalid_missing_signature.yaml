asyncapi: 3.0.0
x-ballerina-event-identifier:
  type: "header"
  name: "X-Invalid-Event"
x-ballerina-auth:
  header: "X-Invalid-Signature"
  signature:
    algorithm: "sha256"
    encoding: "hex"
    headerFormat: "t=$timestamp,v1=$ts"
    input: "$timestamp . '.' . $body"
info:
  title: Invalid Missing Signature Placeholder
  version: 1.0.0
channels:
  events:
    subscribe:
      message:
        x-ballerina-event-type: invalid_event
        payload:
          type: object
