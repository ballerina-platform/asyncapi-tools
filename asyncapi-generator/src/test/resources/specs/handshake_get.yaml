asyncapi: 3.0.0
x-ballerina-event-identifier:
  type: "body"
  path: "eventType"
  handshake:
    method: GET
    challenge:
      in: query
      name: "hub.challenge"
x-ballerina-auth:
  header: "X-Hub-Signature"
  signature:
    algorithm: "sha256"
    encoding: "hex"
    headerFormat: "sha256=$signature"
    input: "$body"
info:
  title: WebSub Handshake Test
  version: 1.0.0
channels:
  events:
    address: events
    messages:
      loginSuccess:
        x-ballerina-event-type: "loginSuccess"
        payload:
          type: object
          required:
            - eventType
          properties:
            eventType:
              type: string
operations:
  receiveEvents:
    action: receive
    channel:
      $ref: "#/channels/events"
    messages:
      - $ref: "#/channels/events/messages/loginSuccess"
