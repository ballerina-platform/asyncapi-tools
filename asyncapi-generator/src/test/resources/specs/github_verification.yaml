asyncapi: 2.6.0
info:
  title: GitHub Test
  version: 1.0.0
channels:
  events:
    subscribe:
      x-ballerina-auth:
        header: X-Hub-Signature-256
        signature:
          algorithm: sha256
          encoding: hex
          headerFormat: sha256=${signature}
          input: ${body}
      message:
        payload:
          type: object
