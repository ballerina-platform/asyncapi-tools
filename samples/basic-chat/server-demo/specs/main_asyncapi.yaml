asyncapi: 3.0.0
info:
  title: /
  version: 0.1.0
servers:
  development:
    host: "{server}:{port}"
    protocol: ws
    protocolVersion: "13"
    pathname: /
    variables:
      server:
        default: ws://localhost
      port:
        default: "9092"
channels:
  root:
    address: /
    messages:
      Hello:
        $ref: "#/components/messages/Hello"
      Response:
        $ref: "#/components/messages/Response"
    description: An echo service that echoes the messages sent by the client.
operations:
  sendHello:
    action: send
    channel:
      $ref: "#/channels/root"
    messages:
    - $ref: "#/channels/root/messages/Hello"
  receiveResponse:
    action: receive
    channel:
      $ref: "#/channels/root"
    messages:
    - $ref: "#/channels/root/messages/Response"
components:
  schemas:
    Hello:
      type: object
      required:
      - message
      - event
      properties:
        message:
          type: string
        event:
          type: string
          const: Hello
    Response:
      type: object
      required:
      - event
      - message
      properties:
        event:
          type: string
          description: dispatcher key
        message:
          type: string
          description: message to be sent
      description: Representation of a response
  messages:
    Response:
      payload:
        $ref: "#/components/schemas/Response"
    Hello:
      payload:
        $ref: "#/components/schemas/Hello"
      x-response:
        $ref: "#/components/messages/Response"
        x-required: false
      x-response-type: simple-rpc
x-dispatcherKey: event
